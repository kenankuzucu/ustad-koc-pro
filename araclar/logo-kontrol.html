<!DOCTYPE html>
<html lang="tr">
<head><meta charset="utf-8"><title>Logo kontrol</title>
<style>
 body{margin:0;font-family:"Segoe UI",sans-serif}
 .satir{display:grid;grid-template-columns:1fr 1fr;gap:0}
 .kutu{padding:26px;display:flex;align-items:center;justify-content:center;min-height:230px}
 .koyu{background:linear-gradient(150deg,#141a2b,#2a1a3d 60%,#0d2a33)}
 .acik{background:#eef7f6}
 .gece{background:#1b2130}
 img{max-width:88%;}
 h3{margin:0;padding:8px 14px;font-size:13px;background:#111;color:#fff}
</style></head>
<body>
 <h3>ŞEFFAF PNG · KOYU ZEMİN (giriş perdesi)</h3>
 <div class="kutu koyu"><img src="../tasarim/ustad-logo-tam.png"></div>
 <h3>ŞEFFAF PNG · AÇIK ZEMİN (üst şerit)</h3>
 <div class="kutu acik"><img src="../tasarim/ustad-logo-tam.png"></div>
 <h3>ŞEFFAF PNG · GECE PALETİ</h3>
 <div class="kutu gece"><img src="../tasarim/ustad-logo-tam.png"></div>
 <h3>UZUN SÜRÜM (sınav türü yazılı)</h3>
 <div class="kutu koyu"><img src="../tasarim/ustad-logo-kpss.png"></div>
 <h3>KOYU ZEMİN SÜRÜMÜ (giriş perdesi için)</h3>
 <div class="kutu koyu"><img src="../tasarim/ustad-logo-tam-koyu.png"></div>
</body>
</html>
